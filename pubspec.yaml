name: aplicacion_finanzas_personales
description: "Saldo - Gestor de finanzas personales"
publish_to: 'none'
version: 2.0.0+20

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado
  provider: ^6.1.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Gráficas
  fl_chart: ^0.69.2

  # Perfil y almacenamiento local (foto, device token)
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  uuid: ^4.5.1

  # Formato de fechas y números
  intl: 0.20.3

  # WOW factor (importación PDF) — se usará en Módulo 5
  file_picker: ^8.1.4
  pdfrx: ^1.0.89

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true